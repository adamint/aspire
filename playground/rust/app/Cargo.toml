[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
opentelemetry = "0.29"
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic", "tls-roots", "internal-logs", "metrics", "logs", "trace"] }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "tls-roots"] }
